# PR Gate — dsh-client-ui-responsive: build + unit-test gate
name: PR Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: npm build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

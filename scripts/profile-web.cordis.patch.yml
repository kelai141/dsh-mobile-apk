# 插件市场（0.13.0 F4，M3.3）：dshmarketplace-plugin——会话 /store 命令、设置页市场、agent 工具与技能文件。
- insert:
    - id: dshmarketplace
      name: dshmarketplace-plugin

# 手机管理授权桥（0.13.0 F1.7，M3.2）：dsh-android-bridge——授权状态机/失败关闭/审计；

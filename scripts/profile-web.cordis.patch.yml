# Android directory-picker composition (2026-08-16 fix):
# the bundle's directory-picker-auto resolves to browse on Android (platform !== linux) and registers
# a browse backend for ctx.directoryPicker — colliding with dsh-host-web-compat's native singleton
# (the later registrant throws duplicate service, the whole auto mount fails → the UI's directory-flow
# slot has no occupant → add/switch workspace entries stop working).
# Fix: disable auto; host-web-compat exclusively owns the capability (kind: native,
# dir-pick endpoint + token auth + shell SAF picker); explicitly mount the
# ui-directory-picker-native surface (renderless flow calling host.pickDirectory).
- id: directory-picker
  disabled: true
- insert:
    - id: picker-native-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'


# 手机管理工具面（0.13.0 F1.6，M3.2）：dsh-android-manage——观察/动作/等待闭环，全部失败关闭。
- insert:
    - id: android-manage
      name: '@dsh-android/dsh-android-manage'

# 工具链与环境设置面板（0.13.0 F1.3/F1.5，M3.2）：dsh-android-linux-env——工具链状态/环境配方/
# 共享目录与镜像设置视图；同时是 shell-termux 写面栅栏（workspaceRoot/sharedDirs，见上文 L20-22）
# 的设置页维护面——不装载则共享目录设置无处维护（审校 C4 2026-08-23：注入四件套缺此条目）。
- insert:
    - id: android-linux-env
      name: '@dsh-android/dsh-android-linux-env'

# 文件直达会话（0.13.0 F5，M3.5）：dsh-android-file-open——外部文件强制新会话请求/状态/清理。
- insert:
    - id: android-file-open
      name: '@dsh-android/dsh-android-file-open'

# Default model（0.13.0 C3 端点级实锤修正，2026-08-25）：此前 pin 到 opencode-go
# （OpenCode Zen Go，opencode.ai/zen/go/v1）——该网关实测对无有效 key 请求返回扁平
# 404（"Not found"），且用户误以为在配 OpenRouter、实际请求发去 Zen Go → 全模型 404、
# 换 key 无用（openclaw #69898 / opencode #31041 同源撞车）。0.13.0 默认改回 dsh 官方
# deepseek-official：壳 shellEnv() 已注入 DEEPSEEK_API_KEY（files/deepseek-key.txt 私有文件），
# 零额外配置、国内可达、开箱即用。opencode-go 仍在「添加自定义供应商」列表中可选。
# 设置界面 agent-default-model 段为用户级（UI 保存会覆盖此默认）。
- id: agent-default-model
  disabled: true
- insert:
    - id: agent-default-model-mobile
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

# Android directory-picker composition (2026-08-16 fix):
# the bundle's directory-picker-auto resolves to browse on Android (platform !== linux) and registers
# a browse backend for ctx.directoryPicker — colliding with dsh-host-web-compat's native singleton
# (the later registrant throws duplicate service, the whole auto mount fails → the UI's directory-flow
# slot has no occupant → add/switch workspace entries stop working).
# Fix: disable auto; host-web-compat exclusively owns the capability (kind: native,
# dir-pick endpoint + token auth + shell SAF picker); explicitly mount the
# ui-directory-picker-native surface (renderless flow calling host.pickDirectory).
- id: directory-picker
  disabled: true
- insert:
    - id: picker-native-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

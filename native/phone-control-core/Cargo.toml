[package]
name = "dsh-phone-control-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
jni = "=0.21.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"

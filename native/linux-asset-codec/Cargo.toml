[package]
name = "dsh-linux-xz"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
liblzma = { version = "=0.4.9", default-features = false, features = ["static"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
libc = "=0.2.177"

[profile.release]
lto = true
codegen-units = 1

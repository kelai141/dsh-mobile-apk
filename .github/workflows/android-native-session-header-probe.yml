name: Android 原生会话读头探针

on:
  pull_request:
    paths:
      - '.github/workflows/android-native-session-header-probe.yml'
      - 'scripts/android-native/session-list-probe/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    env:
      TARGET: ${{ matrix.target }}
      PROBE: scripts/android-native/session-list-probe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 编译 Android 双 ABI 并核对 ELF
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target "$TARGET"
          ndk="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [[ ! -x "$ndk/llvm-readelf" ]]; then
            sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.0.12077973'
          fi
          export RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384'
          linker_env="CARGO_TARGET_${TARGET^^}_LINKER"
          export "${linker_env//-/_}=$ndk/${TARGET}26-clang"
          export "CC_${TARGET//-/_}=$ndk/${TARGET}26-clang"
          export "AR_${TARGET//-/_}=$ndk/llvm-ar"
          cargo +1.99.0 fmt --manifest-path "$PROBE/native/Cargo.toml" --check
          cargo +1.99.0 build --locked --release --manifest-path "$PROBE/native/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/session-header-probe" --target "$TARGET"
          binary="$RUNNER_TEMP/session-header-probe/$TARGET/release/dsh-session-header-probe"
          machine=$("$ndk/llvm-readelf" --file-header "$binary")
          case "$TARGET" in
            aarch64-linux-android) grep -Fq AArch64 <<< "$machine" ;;
            x86_64-linux-android) grep -Fq X86-64 <<< "$machine" ;;
          esac
          "$ndk/llvm-readelf" --program-headers "$binary" |
            awk '$1 == "LOAD" { found=1; if ($NF != "0x4000") bad=1 } END { exit (!found || bad) }'
          node --check "$PROBE/baseline-device.mjs"
          node --check "$PROBE/batch-device.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: session-header-probe-${{ matrix.target }}
          path: ${{ runner.temp }}/session-header-probe/${{ matrix.target }}/release/dsh-session-header-probe
          if-no-files-found: error
          retention-days: 7

name: Android 原生 Git 读取探针

on:
  pull_request:
    paths:
      - '.github/workflows/android-native-git-read-probe.yml'
      - 'scripts/android-native/git-read-probe/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROBE_DIR: scripts/android-native/git-read-probe

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 对照松散对象与打包对象
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          cargo +1.99.0 fmt --manifest-path "$PROBE_DIR/Cargo.toml" --check
          cargo +1.99.0 build --locked --release --manifest-path "$PROBE_DIR/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/git-read-host"
          node "$PROBE_DIR/verify-fixture.mjs" "$RUNNER_TEMP/git-read-host/release/dsh-git-read-probe"

  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 编译并检查 16 KiB 对齐
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --target "$TARGET"
          ndk="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [[ ! -x "$ndk/llvm-readelf" ]]; then
            sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.0.12077973'
          fi
          export RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384'
          linker_env="CARGO_TARGET_${TARGET^^}_LINKER"
          export "${linker_env//-/_}=$ndk/${TARGET}26-clang"
          cargo +1.99.0 build --locked --release --manifest-path "$PROBE_DIR/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/git-read-native" --target "$TARGET"
          binary="$RUNNER_TEMP/git-read-native/$TARGET/release/dsh-git-read-probe"
          machine=$("$ndk/llvm-readelf" --file-header "$binary")
          case "$TARGET" in
            aarch64-linux-android) grep -Fq AArch64 <<< "$machine" ;;
            x86_64-linux-android) grep -Fq X86-64 <<< "$machine" ;;
          esac
          "$ndk/llvm-readelf" --program-headers "$binary" |
            awk '$1 == "LOAD" { found=1; if ($NF != "0x4000") bad=1 } END { exit (!found || bad) }'
      - uses: actions/upload-artifact@v4
        with:
          name: git-read-probe-${{ matrix.target }}
          path: ${{ runner.temp }}/git-read-native/${{ matrix.target }}/release/dsh-git-read-probe
          if-no-files-found: error
          retention-days: 7

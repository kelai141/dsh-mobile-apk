# pages.yml —— 发布页站点：构建 + 部署到 GitHub Pages
#
# 定位（刻意做轻）：
#   只做「读 release 元数据 -> 生成静态站 -> 部署」。**不碰 gradle / 快照 / LFS / 打包链**，
#   所以它不会因为重链失败而拖死，也不会拖慢重链。整链约 30 秒。
#
# 触发：
#   - push 到 main 且 webpages/** 或本工作流变化：站点源码改动即部署
#   - release(published): refresh after a draft becomes publicly downloadable
#   - workflow_dispatch：手动补部署
#
# 权限最小化：contents: read 只读源码；pages/id-token 仅部署 job 持有。
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'webpages/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Release events point at the tag; site sources live on the default branch.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # 门禁先行：资产名与发布链绑定，发布链改名即判红（防重演 App 侧坑 172）。
      # 必须给 glob：node --test 在 Node 24 上**不接受目录**（传目录会按 CJS 解析并报
      # Cannot find module .../webpages/tests，实测 exit 1）。引号交给 node 自己展开，
      # 不依赖 shell 的 glob 行为。
      - name: 资产名与 URL 拼接门禁
        run: node --test "webpages/tests/*.test.mjs"
      # --refresh：构建同时把最新 release 写回 data/releases.json 种子。
      # 为什么需要（用户 2026-10-17 指出）：种子是 GitHub API 不可用时的兜底数据源，
      # 不跟着发版走就会一直停在上一版——API 被限流（未认证 60 次/小时/IP，C 端 CGNAT
      # 共享出口极易命中）时，用户看到的是旧版本号与旧资产清单。
      - name: 构建静态站（含刷新种子）
        run: node webpages/tools/build.mjs --refresh
      # 种子漂移必须显式可见：refresh 会改写工作区文件，若忘记提交回 main，下一次 API
      # 限流又会回落旧数据。这里只告警不判红（发版链不应因站点种子失败）。
      - name: 种子漂移提示
        if: always()
        run: |
          if ! git diff --quiet -- webpages/data/releases.json; then
            echo "::warning::webpages/data/releases.json 已随构建刷新，请把差异提交回 main"
            git --no-pager diff --stat -- webpages/data/releases.json
          fi
      - name: 站点自检（产物存在 + 占位符已替换 + 体积预算）
        run: |
          set -euo pipefail
          test -s webpages/dist/index.html
          test -s webpages/dist/assets/app.js
          test -s webpages/dist/data/releases.json
          test -f webpages/dist/.nojekyll
          for token in '__STYLES__' '__RELEASE_DATA__'; do
            if grep -q "$token" webpages/dist/index.html; then
              echo "::error::占位符未替换: $token"
              exit 1
            fi
          done
          size=$(stat -c%s webpages/dist/index.html)
          echo "index.html = $size bytes"
          test "$size" -lt 122880
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webpages/dist

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

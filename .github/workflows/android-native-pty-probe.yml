name: Android 原生 PTY 探针

on:
  pull_request:
    paths:
      - '.github/workflows/android-native-pty-probe.yml'
      - 'scripts/android-native/pty-probe/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 准备 Rust 与 Android NDK
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target "${{ matrix.target }}"
          if [[ ! -x "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" ]]; then
            sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.0.12077973'
          fi
      - name: 交叉编译与核对 ELF
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384'
          linker_env="CARGO_TARGET_${TARGET^^}_LINKER"
          export "${linker_env//-/_}=$ndk/${TARGET}26-clang"
          cargo +1.99.0 fmt --manifest-path scripts/android-native/pty-probe/Cargo.toml --check
          cargo +1.99.0 build --locked --release --manifest-path scripts/android-native/pty-probe/Cargo.toml \
            --target-dir "$RUNNER_TEMP/native-build" --target "$TARGET"
          binary="$RUNNER_TEMP/native-build/$TARGET/release/dsh-native-pty-probe"
          machine=$("$ndk/llvm-readelf" --file-header "$binary")
          case "$TARGET" in
            aarch64-linux-android) grep -Fq AArch64 <<< "$machine" ;;
            x86_64-linux-android) grep -Fq X86-64 <<< "$machine" ;;
          esac
          "$ndk/llvm-readelf" --program-headers "$binary" |
            awk '$1 == "LOAD" { found=1; if ($NF != "0x4000") bad=1 } END { exit (!found || bad) }'
      - uses: actions/upload-artifact@v4
        with:
          name: pty-probe-${{ matrix.target }}
          path: ${{ runner.temp }}/native-build/${{ matrix.target }}/release/dsh-native-pty-probe
          if-no-files-found: error
          retention-days: 7

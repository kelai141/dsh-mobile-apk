# PR Gate — dsh-mobile-apk：静态扫描 + Kotlin 编译门禁 + PR 规范检查
# 发布门禁仍在本地 build-release.ps1；此处只拦低级错误与规范问题。
name: PR Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    name: 冲突标记与敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 冲突标记检查
        run: |
          if grep -rEn '^(<<<<<<< |>>>>>>> )' app/src --include='*.kt' --include='*.java' --include='*.xml' --include='*.html' --include='*.js' --include='*.yml' --include='*.yaml'; then
            echo "::error::检测到未解决的 merge conflict 标记"
            exit 1
          fi
          echo "无冲突标记 ✓"
      - name: 敏感信息扫描
        run: |
          if grep -rEn '(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})' app/src scripts 2>/dev/null; then
            echo "::error::检测到疑似密钥/令牌"
            exit 1
          fi
          echo "无敏感信息 ✓"

  compile:
    name: Kotlin 编译门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle 缓存加速：依赖/构建缓存跨运行复用（首次全量，之后增量）
      - uses: gradle/actions/setup-gradle@v4
      - name: 确保 Android SDK platform 36
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      - name: 编译 debug Kotlin（compileDebugKotlin，不依赖快照资产）
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

  lint-pr:
    name: PR 规范检查（标题/label）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || ''
            const labels = (context.payload.pull_request.labels || []).map(l => l.name)
            const isFork = !!context.payload.pull_request.head.repo.fork
            const type = title.split(/[!:]/)[0].trim().toLowerCase()
            const validTypes = ['fix','feat','docs','refactor','test','ci','chore','perf','style','build','revert']
            const labelMap = {
              fix: ['bug'], feat: ['feature','enhancement'], docs: ['docs'],
              refactor: ['refactor'], test: ['test'], chore: ['chore','dependencies','ci'],
              ci: ['ci'], perf: ['enhancement','chore'], style: ['enhancement','chore'],
              build: ['enhancement','chore'], revert: ['enhancement','chore'],
            }
            const problems = []
            if (!validTypes.includes(type)) {
              problems.push('标题必须以 type 开头（fix:/feat:/docs:/refactor:/test:/ci:/chore:/perf:/style:/build:/revert:）')
            }
            if (labels.length === 0) problems.push('缺少 label（至少 1 个，主 label 与标题 type 对应）')
            if (labels.length > 3) problems.push('label 超过 3 个（最多 3 个）')
            if (type && labelMap[type] && labels.length && !labels.some(l => labelMap[type].includes(l))) {
              problems.push('主 label 与标题 type 不匹配（' + type + ' 应对应 ' + labelMap[type].join('/') + '）')
            }
            if (problems.length === 0) {
              core.info('PR 规范检查通过 ✓（title=' + title + ' labels=' + labels.join(',') + '）')
              return
            }
            // fork PR 提交者无打标权限：label 问题只提示不阻断；标题问题阻断
            // 标题不规范阻断（作者可控）；仅 label 问题不阻断（fork PR 无打标权限）
            const fatal = problems.some(p => p.includes('标题')) && !isFork
            const body = '## PR 规范检查未通过\n\n- ' + problems.join('\n- ') +
              (isFork ? '\n\n（来自 fork 的 PR 无法自行打 label，请 maintainer 合并时补充）' : '') +
              '\n\n规范见维护手册 4.6 / pr-guidelines。'
            // Fork PR 的 GITHUB_TOKEN 是只读的（无 issues:write），createComment
            // 会抛 Resource not accessible——降级为 warning，不阻断 job。
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              })
            } catch (commentErr) {
              core.warning('无法评论 PR（fork 只读 token）：' + commentErr.message)
            }
            if (fatal && !isFork) {
              core.setFailed('PR 规范检查失败')
            } else {
              core.warning('PR 规范检查未完全通过（仅提示）：' + problems.join('；'))
            }

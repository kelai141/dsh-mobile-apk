# PR Gate — dsh-mobile-apk: static scan + Kotlin compile gate + PR spec checks
# Release and APK packaging use the repository build entrypoints; this workflow checks source contracts.
name: PR Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: 冲突标记与敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # APK assembly/version/signature contracts are small Node-only regressions; run them on every PR
      # instead of waiting for a manual local build or the release workflow to exercise them.
      - name: APK 组装、版本与签名回归
        if: always()
        run: node --test scripts/check-apk-signatures.test.mjs scripts/resolve-version-suffix.test.mjs scripts/build-apk-engine.test.mjs scripts/check-third-party.test.mjs
      - name: 冲突标记检查
        if: always()
        run: |
          if grep -rEn '^(<<<<<<< |>>>>>>> )' app/src --include='*.kt' --include='*.java' --include='*.xml' --include='*.html' --include='*.js' --include='*.yml' --include='*.yaml'; then
            echo "::error::检测到未解决的 merge conflict 标记"
            exit 1
          fi
          echo "无冲突标记"
      - name: 敏感信息扫描
        if: always()
        run: |
          if grep -rEn '(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})' app/src scripts 2>/dev/null; then
            echo "::error::检测到疑似密钥/令牌"
            exit 1
          fi
          echo "无敏感信息"
      - name: 来源审计源码替换回归
        if: always()
        run: |
          python3 -m unittest discover -s scripts/source-build -p 'test_*.py' -v
          node --test scripts/source-build/*.test.mjs
          node scripts/source-build/check-package-lock-roots.mjs
      # 补丁镜像面（自我一致性，不引用协调仓）：本仓是公开的自包含构建宿主，**不得**依赖
      # 私有协调仓——此前用 `GH_PAT` 跨仓检出私有 dsh-mobile，PAT 失效即在检出步骤硬失败，
      # 该 job 的门禁全部 skipped（0.14.0 实测：PAT 已无法读取协调仓）。
      # 跨仓逐字节一致性由**能同时看到两仓的那一侧**保证：协调仓 CI 的
      # 「检出镜像对端三面」步骤会把本仓 + 两个子仓检出，跑 check-patch-mirror --require-peer。
      # 这里只做本仓自包含面的守门（补丁自洽 + 引擎树补丁行为回归），不跨仓。
      - name: 补丁自洽与引擎树补丁回归
        if: always()
        run: |
          # --self：只跑本仓自包含面（registry/IMPLS 集合一致、补丁文件在场、tests 清单自洽），
          # 不读对端树；跨仓逐字节一致性由协调仓 CI 的 --require-peer 那一侧守。
          node scripts/check-patch-mirror.mjs --self
          # 0.14.2 T6：夹具停在上一代引擎时补丁回归测试是结构性假绿（本仓同样携带 tests/ 镜像面）
          node scripts/check-patch-fixtures.mjs
          # 0.14.5 C-1：原先此处硬编码跑 3 个补丁回归（26 个里只覆盖 3 个）。改用清单门禁——
          # 它串行跑全部 26 个，并对已知失败要求带 reason/since 的显式声明，新增失败立刻判红。
          # 那 3 条已被完整覆盖，故删除硬编码行而不是并行保留（避免两处清单各自漂移）。
          node scripts/check-patch-test-manifest.mjs
      - name: 准备插件产物（单次锁解析、安装与构建）
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # termux 位于统一清单首位，linux-env 编译依赖它的 lib；各消费者复用本次产物。
          mapfile -t plugin_dirs < <(node -e "const {dirs}=require('./scripts/plugin-dirs.json'); console.log(dirs.filter(d=>d==='dsh-shell-termux'||d.startsWith('plugins/')).join('\n'))")
          test "${#plugin_dirs[@]}" -gt 0
          for d in "${plugin_dirs[@]}"; do
            node scripts/source-build/install-project-dependencies.mjs "$d" .deploy-tmp/source-build/plugin-lock-resolution-pr.json
            (cd "$d" && npm run build)
          done
      # 控制协议 V2（0.13.8 批 F）：引擎侧编解码的往返等价与体积基线（壳侧 Kotlin 一侧由
      # 本仓单测 + 跨语言往返门禁另守）。
      - name: 协议 V2 往返与体积门禁
        if: always()
        run: |
          node scripts/check-protocol-v2.mjs
      - name: 控制 op 登记链门禁
        if: always()
        run: node scripts/check-control-ops.mjs
      # 跨语言 op 清单对等（0.14.1）：引擎 REAL_SCREEN_CONTROL_OPS 与壳侧 REAL_SCREEN_OPS 必须逐条相同。
      # 两份清单漂移就是「virtual-only 下点击校验/WebView 路径全不可用」的根因（壳侧多带 3 条不读屏的 op）。
      - name: op 清单跨语言对等门禁
        if: always()
        run: node scripts/check-op-registry-parity.mjs
      # 工具名「承诺 vs 实现」（0.14.1）：指引里提到的 android_* 工具名必须真有声明位
      # （android_vdisplay_input 曾被三处文案与 Skill 文档承诺却从未 defineTool）。
      - name: 工具名承诺门禁
        if: always()
        run: node scripts/check-tool-name-promises.mjs
      # 插件单测门禁（0.14.1 §1.1b 决策 1 / §2.4 前置项 1）：脚本存在却从未被调用，34 个测试文件无人跑。
      # 真跑各插件 test/*.test.mjs（全 skip 判假绿）——需 plugins/*/lib 产物，故先构建。
      - name: 插件单测门禁
        if: always()
        run: |
          node scripts/check-plugin-tests.mjs
      # 工具返回值 vs output.schema 运行时契约门禁（0.13.8-b 批 B2 T2 / E-10）。
      # 依赖上一步构建出的 8 个包 lib（门禁要求 7 个插件的 lib/index.js 在场，缺产物判红——
      # 原先它只自建 manage 一个，结构上必红：0.14.1 执行地图排查发现，本轮修复）。
      - name: 工具输出 schema 契约门禁
        if: always()
        run: |
          # manage 将引擎校验器列为固定 devDependency；准备阶段的已解析 lock/npm ci 已安装它。
          # 契约脚本直接导入该真实校验器，缺席仍判红，不重新解析第二套依赖图。
          node scripts/check-tool-output-schema.mjs
      # 壳侧加固语义（NSC / backup 规则 / exported）与子进程有界读（0.13.8-b FX-208.4 / E1）
      - name: 壳侧加固与有界读门禁
        if: always()
        run: |
          node scripts/check-manifest-hardening.mjs
          node scripts/check-bounded-io.mjs
          node scripts/check-api-route-auth.mjs
      # 冷启动预算（0.14.1 块F P0-2；【0.14.1 P0-a 修复】原来写死 --self-test，使真检被结构性绕开）。
      # 改为默认档：有真产物则真检（超预算 exit 1），无产物则显式 SKIP(real-data) 后跑自证。
      # CI 无设备，故常态是 SKIP+自证——**SKIP 不等于达标**，真检由设备验收步骤驱动（--pull/--segments）。
      - name: 冷启动预算门禁（真产物优先，无产物 SKIP+自证）
        if: always()
        run: node scripts/check-boot-budget.mjs
      # 快照构建器产出面（0.14.1 P0 反回归）：锁归档段是否还在（被删 -> 静默复用陈旧快照）。
      - name: 快照构建器产出面门禁
        if: always()
        run: node scripts/check-snapshot-builder-output.mjs
      # 浏览器语法下限（0.14.1 块C G-1）：CI 无构建树 -> --self-test 四向自证（反向必红/正向必绿/
      # 载荷不触发/工具链在场且版本钉住）。
      - name: 浏览器语法下限门禁（自证）
        if: always()
        run: node scripts/check-browser-syntax-floor.mjs --self-test
      # 构建并发上限（0.14.1 用户拍板系统级约束）：打包固定 8 线程、不得吃满 16 逻辑核。
      - name: 构建并发上限门禁
        if: always()
        run: node scripts/check-build-parallel-cap.mjs
      # 快照指纹对账（ST-04）：净检出下 tar 被 .gitignore 忽略 → SKIP 计数（构建链以 --require 严格跑）
      - name: 快照指纹对账门禁
        if: always()
        run: node scripts/check-snapshot-fingerprint.mjs
      # 接线面聚合断言（0.13.8-b FX-208.2/E2）：本仓布局下解析到同名相对路径
      - name: 门禁接线面聚合断言
        if: always()
        run: node scripts/check-release-gates.mjs
      # 制度性门禁（0.13.8-b 批 B2 ST-25/26/31）：状态登记制 / 桥面对称性 / 门禁覆盖与 SKIP 纪律。
      # 三者离线可跑（不依赖快照），故在 CI 与两条构建链同源；性能度量入口在无快照时计数 SKIP。
      - name: 制度性门禁（登记制 / 桥面对称 / SKIP 纪律）
        if: always()
        run: |
          node scripts/check-state-registry.mjs
          node scripts/check-bridge-symmetry.mjs
          node scripts/check-gate-skips.mjs
          node scripts/check-kotlin-comments.mjs
          # 执行地图覆盖与锚点（0.14.2 D7）：纳入聚合声明集后，apk 侧 CI 也必须有独立调用点。
          node scripts/check-code-map.mjs
          node scripts/check-build-chain-abort.mjs
          node scripts/check-perf-instrumentation.test.mjs
          node scripts/check-perf-instrumentation.mjs
      # 模型面工具 wire 预算（0.14.0 §4.1 渐进披露）：双口径；名单从 capability-gate 导出。
      # 需先构建七个模型面插件的 lib（门禁真跑 apply()），缺产物时门禁明确拒绝而非假绿。
      - name: 模型面工具 wire 预算门禁
        if: always()
        run: |
          node scripts/check-tool-surface-budget.mjs

  compile:
    name: Kotlin 编译门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle cache acceleration: dependency/build caches reused across runs (full on first, incremental after)
      - uses: gradle/actions/setup-gradle@v4
      - name: 确保 Android SDK platform 36
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      # Kotlin 单测门禁（0.14.1 P0：此前 CI **从不跑** testDebugUnitTest——全仓 grep 零命中）。
      # 为什么必须补：本轮全量实跑 456 例，其中契约断言（CallSiteContractTest / BootDiagnosticsContractTest
      # / ApiLevelGuardTest / UndoGateDecisionTest / SnapshotTransactionTest / NotificationContractTest /
      # OverlayHaloInvariantTest / BootFailLogTest …）**只有在 CI 里跑起来才是防线**；否则它们只是
      # 「本地跑过」，改坏实现不会有任何拦截——与 P0-a「判据真会红但被结构性绕开」是同一形态。
      # 全量实跑（Lead 本机，同 runner 档位）：456 tests / 0 failures / 1 skipped，冷启 BUILD ~39s。
      # 故**取全量**而非子集：耗时与 compileDebugKotlin 同档（缓存命中后更快），没有"为省时间不接"的理由。
      - name: 编译与单元测试门禁（testDebugUnitTest 自动编译主代码和测试）
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      # Kotlin 单测**数量**反回归门禁（0.14.2-fx-2 G.0 ⑤ 结构性脱节实修）。
      # 真因：CI 跑 testDebugUnitTest 只按退出码判——「测试类被删/改名/漏编译」时 exit 仍 0，
      # 而云端链又给本门禁传 --allow-missing（无结果=SKIP）⇒ 防线被删却一路绿。此处紧接上一
      # 步骤（结果目录已就位）、**不传 --allow-missing**：结果缺席即判红，逐类基线只许升。
      - name: Kotlin 单测数量反回归（逐类基线 + 无缺席 + 结果新鲜）
        run: node scripts/check-kotlin-test-count.mjs
      # 测试报告留档：失败时可直接下载 HTML 报告（否则只有日志尾部行）。
      - name: 上传单测报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  maintenance:
    name: 维护文档一致性（提示）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: 选择受影响的维护输入
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(app/build.gradle.kts|build.gradle.kts|gradle/wrapper/gradle-wrapper.properties|scripts/patches/registry.json|scripts/check-maintenance-docs.mjs|scripts/tests/maintenance-docs.test.mjs|docs/AGENTS/(DEPENDENCIES|RUNTIME-PATCHES).md)$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: 检查生成块与生成器反证
        if: steps.inputs.outputs.changed == 'true'
        run: |
          node --test scripts/tests/maintenance-docs.test.mjs
          node scripts/check-maintenance-docs.mjs

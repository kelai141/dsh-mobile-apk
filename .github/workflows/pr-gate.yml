# PR Gate — dsh-mobile-apk: static scan + Kotlin compile gate + PR spec checks
# Release and APK packaging use the repository build entrypoints; this workflow checks source contracts.
name: PR Gate

on:
  pull_request:
  push:
    branches: [main]

# 并发控制（2026-10-28）：同一分支连推两次会并发跑两份 PR Gate。两份都烧 runner，
# 而且旧的那份可能后完成——它带着旧的检出状态给自己的检查项盖章，看起来是绿的，实际验的不是最新代码。
# PR 上用 cancel-in-progress 让新推覆盖旧的；push 到 main 不取消，避免主干上的检查被后一次推挤掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: 冲突标记与敏感信息扫描
    runs-on: ubuntu-latest
    # 实测：static job 历史最长约 2 分 40 秒（28 个步骤，最慢的是插件构建 26s、
    # 工具输出 schema 契约 42s、插件单测 38s），取 15 分钟约 5.6 倍余量。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: 快照门禁回归
        if: always()
        run: python3 scripts/ci-verify-snapshot.py --self-test
      # APK assembly/version/signature contracts are small Node-only regressions; run them on every PR
      # instead of waiting for a manual local build or the release workflow to exercise them.
      - name: Console keyboard layout regressions
        if: always()
        run: node --test scripts/console-keyboard-layout.test.mjs
      # 软链自净化（issue #1204）：自指链曾「先 rmSync 再 symlinkSync('')」抛 ENOENT 并丢掉链接；
      # 越界目标曾被改写成逃出 stage 树的相对链。两条都只能在真软链上复现，故单独跑这一份。
      - name: Symlink sanitize regressions
        if: always()
        run: node --test scripts/symlink-sanitize.test.mjs
      # 订阅 provider 的代理面（issue #1282）：发给浏览器的视图曾把 URL 内嵌 userinfo 的密码原样回传，
      # passwordSet 还报 false，出错文案也回显整条 URL。用例对序列化结果做全舰搜索（密码用随机串做夹具）。
      - name: Subscriptions proxy secret regressions
        if: always()
        run: node --test scripts/subs-proxy-secrets.test.mjs
      # 订阅 provider 的 SSE 面（issue #1284）：pending 无上限 + 每 chunk 重置看门狗（既 OOM 又永不超时）、
      # 以及末帧无空行即丢弃。三条都只能靠构造字节流复现，故单独跑这一份。
      - name: Subscriptions SSE limit regressions
        if: always()
        run: node --test scripts/subs-sse-limits.test.mjs
      - name: APK 组装、版本与签名回归
        if: always()
        run: node --test scripts/check-apk-signatures.test.mjs scripts/resolve-version-suffix.test.mjs scripts/build-apk-engine.test.mjs scripts/check-third-party.test.mjs scripts/check-upstream-patch-bytes.test.mjs scripts/wsl-node-command.test.mjs scripts/check-bridge-symmetry.test.mjs scripts/check-snapshot-secrets.test.mjs
      - name: 下载站发布同步与路由回归
        if: always()
        run: |
          node webpages/tools/build.mjs --self-test
          node webpages/tools/build.mjs
      - name: 冲突标记检查
        if: always()
        run: |
          # 覆盖文档与脚本：docs/ 下曾遗留未解决的冲突标记（#1012 合并进 modules.md），
          # 旧版只扫 app/src 的代码文件，因此漏检。这里扩到 docs/.github/scripts，
          # 但**只匹配         run: node scripts/check-release-gates.mjs && node scripts/check-vendor-provenance.mjs && node scripts/check-vendor-provenance.mjs --self-test && node scripts/check-retired-plugins.mjs && node scripts/check-retired-plugins.mjs --self-test && node scripts/check-snapshot-node-floor.mjs && node scripts/check-snapshot-node-floor.mjs --self-test
      # 制度性门禁（0.13.8-b 批 B2 ST-25/26/31）：状态登记制 / 桥面对称性 / 门禁覆盖与 SKIP 纪律。
      # 三者离线可跑（不依赖快照），故在 CI 与两条构建链同源；性能度量入口在无快照时计数 SKIP。
      - name: 制度性门禁（登记制 / 桥面对称 / SKIP 纪律）
        if: always()
        run: |
          node scripts/check-state-registry.mjs
          node scripts/check-bridge-symmetry.mjs
          node scripts/check-gate-skips.mjs
          # workflow 输入内插面（issue #1614）：run 块内不得出现 ${{ inputs.* }} / ${{ github.event.inputs.* }}。
          node scripts/check-workflow-input-injection.mjs
          node scripts/check-kotlin-comments.mjs
          # 中英文案一致性（0.15.0）：资源键集合成对 + tr() 双参数；漏英文时 Android 静默回退中文。
          node scripts/check-i18n-parity.mjs
          # 执行地图覆盖与锚点（0.14.2 D7）：纳入聚合声明集后，apk 侧 CI 也必须有独立调用点。
          node scripts/check-code-map.mjs
          node scripts/check-build-chain-abort.mjs
          node scripts/check-perf-instrumentation.test.mjs
          node scripts/check-perf-instrumentation.mjs
      # 模型面工具 wire 预算（0.14.0 §4.1 渐进披露）：双口径；名单从 capability-gate 导出。
      # 需先构建七个模型面插件的 lib（门禁真跑 apply()），缺产物时门禁明确拒绝而非假绿。
      - name: 模型面工具 wire 预算门禁
        if: always()
        run: |
          node scripts/check-tool-surface-budget.mjs

  compile:
    name: Kotlin 编译门禁
    runs-on: ubuntu-latest
    # 实测：compile job 历史最长约 1 分 25 秒。取 20 分钟是因为首次无 Gradle 缓存时
    # 依赖下载会显著变慢，这一档不能按缓存命中的数值定。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle cache acceleration: dependency/build caches reused across runs (full on first, incremental after)
      - uses: gradle/actions/setup-gradle@v4
      - name: 确保 Android SDK platform 36
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      # Kotlin 单测门禁（0.14.1 P0：此前 CI **从不跑** testDebugUnitTest——全仓 grep 零命中）。
      # 为什么必须补：本轮全量实跑 456 例，其中契约断言（CallSiteContractTest / BootDiagnosticsContractTest
      # / ApiLevelGuardTest / UndoGateDecisionTest / SnapshotTransactionTest / NotificationContractTest /
      # OverlayHaloInvariantTest / BootFailLogTest …）**只有在 CI 里跑起来才是防线**；否则它们只是
      # 「本地跑过」，改坏实现不会有任何拦截——与 P0-a「判据真会红但被结构性绕开」是同一形态。
      # 全量实跑（Lead 本机，同 runner 档位）：456 tests / 0 failures / 1 skipped，冷启 BUILD ~39s。
      # 故**取全量**而非子集：耗时与 compileDebugKotlin 同档（缓存命中后更快），没有"为省时间不接"的理由。
      - name: 编译与单元测试门禁（testDebugUnitTest 自动编译主代码和测试）
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --rerun-tasks
      # Kotlin 单测**数量**反回归门禁（0.14.2-fx-2 G.0 ⑤ 结构性脱节实修）。
      # 真因：CI 跑 testDebugUnitTest 只按退出码判——「测试类被删/改名/漏编译」时 exit 仍 0，
      # 而云端链又给本门禁传 --allow-missing（无结果=SKIP）⇒ 防线被删却一路绿。此处紧接上一
      # 步骤（结果目录已就位）、**不传 --allow-missing**：结果缺席即判红，逐类基线只许升。
      - name: Kotlin 单测数量反回归（逐类基线 + 无缺席 + 结果新鲜）
        run: node scripts/check-kotlin-test-count.mjs
      # 快照解码器运行时反证：CI 净检出没有构建好的 snapshot.tar.xz，故用合成小归档。
      # 自测调用生产同源 Java streaming probe，校验正常解码、截断/翻转必失败；另独立运行 SHA-256 指纹门禁正反例。
      # 这只证明门禁具备判别力，不代表最终 APK 的快照已通过解码；正式资产仍由 build-apk.mjs 在组装后以 --require 检验。
      - name: 快照解码器反证自测（合成归档）
        run: node scripts/check-snapshot-decode.mjs --self-test-runtime
      # 测试报告留档：失败时可直接下载 HTML 报告（否则只有日志尾部行）。
      - name: 上传单测报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  maintenance:
    name: 维护文档一致性（提示）
    runs-on: ubuntu-latest
    # 实测：maintenance job 约 12 秒，取 10 分钟。
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: 选择受影响的维护输入
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(app/build.gradle.kts|build.gradle.kts|gradle/wrapper/gradle-wrapper.properties|scripts/patches/registry.json|scripts/check-maintenance-docs.mjs|scripts/tests/maintenance-docs.test.mjs|docs/AGENTS/(DEPENDENCIES|RUNTIME-PATCHES).md)$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: 检查生成块与生成器反证
        if: steps.inputs.outputs.changed == 'true'
        run: |
          node --test scripts/tests/maintenance-docs.test.mjs
          node scripts/check-maintenance-docs.mjs

  reasoning:
    name: 四家推理协议与升级回归
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: 从当前夹具读取协议客户端版本
        shell: bash
        run: |
          baseline=$(node -p 'require("./scripts/contract.json").baseline')
          version=$(node -p "require('./scripts/patches/tests/fixtures/pi-ai-$baseline/package.json').version")
          npm install --prefix "$RUNNER_TEMP/reasoning-1304" --ignore-scripts --no-audit --no-fund "@earendil-works/pi-ai@$version" "@deepseek-ai/dsh-timeout@$baseline" "@deepseek-ai/dsh-llm@$baseline" "@deepseek-ai/dsh-llm-pi-ai@$baseline"
          echo "DSH_REASONING_RUNTIME=$RUNNER_TEMP/reasoning-1304/node_modules/@earendil-works/pi-ai" >> "$GITHUB_ENV"
      - name: 空摘要、隔离、负控与两轮工具回传
        run: |
          node --test scripts/patches/tests/reasoning-envelope-1304.test.mjs
          node --test scripts/patches/tests/reasoning-envelope-1304.integration.mjs

# PR Gate — dsh-mobile-apk: static scan + Kotlin compile gate + PR spec checks
# Release and APK packaging use the repository build entrypoints; this workflow checks source contracts.
name: PR Gate

on:
  pull_request:
  push:
    branches: [main]

# 并发控制（2026-10-28）：同一分支连推两次会并发跑两份 PR Gate。两份都烧 runner，
# 而且旧的那份可能后完成——它带着旧的检出状态给自己的检查项盖章，看起来是绿的，实际验的不是最新代码。
# PR 上用 cancel-in-progress 让新推覆盖旧的；push 到 main 不取消，避免主干上的检查被后一次推挤掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    # 保留旧显示名以兼容 branch protection 的 required check；实际仅扫新增敏感信息。
    name: 冲突标记与敏感信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: 增量敏感信息扫描自测
        run: node scripts/check-added-secrets.mjs --self-test
      - name: 仅扫描本次新增内容中的敏感信息
        run: node scripts/check-added-secrets.mjs --event "$GITHUB_EVENT_PATH"

  changes:
    name: Kotlin 文件变更检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kotlin: ${{ steps.paths.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Kotlin 路径筛选自测
        run: node scripts/pr-kotlin-changes.mjs --self-test
      - name: 检测本次差异的 Kotlin 文件路径
        id: paths
        run: node scripts/pr-kotlin-changes.mjs --event "$GITHUB_EVENT_PATH"

  compile:
    name: Kotlin 编译门禁
    needs: changes
    # 只认 .kt（不含 .kts）；新增、删除和重命名任一侧均计入。
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    # 实测：compile job 历史最长约 1 分 25 秒。取 20 分钟是因为首次无 Gradle 缓存时
    # 依赖下载会显著变慢，这一档不能按缓存命中的数值定。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle cache acceleration: dependency/build caches reused across runs (full on first, incremental after)
      - uses: gradle/actions/setup-gradle@v4
      - name: 确保 Android SDK platform 36
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      # Kotlin 单测门禁（0.14.1 P0：此前 CI **从不跑** testDebugUnitTest——全仓 grep 零命中）。
      # 为什么必须补：本轮全量实跑 456 例，其中契约断言（CallSiteContractTest / BootDiagnosticsContractTest
      # / ApiLevelGuardTest / UndoGateDecisionTest / SnapshotTransactionTest / NotificationContractTest /
      # OverlayHaloInvariantTest / BootFailLogTest …）**只有在 CI 里跑起来才是防线**；否则它们只是
      # 「本地跑过」，改坏实现不会有任何拦截——与 P0-a「判据真会红但被结构性绕开」是同一形态。
      # 全量实跑（Lead 本机，同 runner 档位）：456 tests / 0 failures / 1 skipped，冷启 BUILD ~39s。
      # 故**取全量**而非子集：耗时与 compileDebugKotlin 同档（缓存命中后更快），没有"为省时间不接"的理由。
      - name: 编译与单元测试门禁（testDebugUnitTest 自动编译主代码和测试）
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --rerun-tasks
      # Kotlin 单测**数量**反回归门禁（0.14.2-fx-2 G.0 ⑤ 结构性脱节实修）。
      # 真因：CI 跑 testDebugUnitTest 只按退出码判——「测试类被删/改名/漏编译」时 exit 仍 0，
      # 而云端链又给本门禁传 --allow-missing（无结果=SKIP）⇒ 防线被删却一路绿。此处紧接上一
      # 步骤（结果目录已就位）、**不传 --allow-missing**：结果缺席即判红，逐类基线只许升。
      - name: Kotlin 单测数量反回归（逐类基线 + 无缺席 + 结果新鲜）
        run: node scripts/check-kotlin-test-count.mjs
      # 快照解码器运行时反证：CI 净检出没有构建好的 snapshot.tar.xz，故用合成小归档。
      # 自测调用生产同源 Java streaming probe，校验正常解码、截断/翻转必失败；另独立运行 SHA-256 指纹门禁正反例。
      # 这只证明门禁具备判别力，不代表最终 APK 的快照已通过解码；正式资产仍由 build-apk.mjs 在组装后以 --require 检验。
      - name: 快照解码器反证自测（合成归档）
        run: node scripts/check-snapshot-decode.mjs --self-test-runtime
      # issue #1705：glibc loader 门禁的判别力自证。判据全在纯字节面上（ELF 架构 / jni 目录
      # 命名 / zip 里是否 stored / 是否混入另一 ABI），故离线可跑，不需要 APK 也不需要 SDK。
      # 为什么放在 CI：这道门禁的真执行点是两条打包链的终端阶段（那里才有 APK），
      # 而「它本身会不会判红」只有自测能证明 —— 否则一条恒绿的门禁等于没有。
      - name: glibc loader 门禁自证（ELF 架构 / ABI 分档 / 产物断言）
        run: node scripts/check-native-linux-loader.mjs --self-test
      # 测试报告留档：失败时可直接下载 HTML 报告（否则只有日志尾部行）。
      - name: 上传单测报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  maintenance:
    name: 维护文档一致性（提示）
    runs-on: ubuntu-latest
    # 实测：maintenance job 约 12 秒，取 10 分钟。
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: 选择受影响的维护输入
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(app/build.gradle.kts|build.gradle.kts|gradle/wrapper/gradle-wrapper.properties|scripts/patches/registry.json|scripts/check-maintenance-docs.mjs|scripts/tests/maintenance-docs.test.mjs|docs/AGENTS/(DEPENDENCIES|RUNTIME-PATCHES).md)$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: 检查生成块与生成器反证
        if: steps.inputs.outputs.changed == 'true'
        run: |
          node --test scripts/tests/maintenance-docs.test.mjs
          node scripts/check-maintenance-docs.mjs

  reasoning:
    name: 四家推理协议与升级回归
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: 从当前夹具读取协议客户端版本
        shell: bash
        run: |
          baseline=$(node -p 'require("./scripts/contract.json").baseline')
          version=$(node -p "require('./scripts/patches/tests/fixtures/pi-ai-$baseline/package.json').version")
          npm install --prefix "$RUNNER_TEMP/reasoning-1304" --ignore-scripts --no-audit --no-fund "@earendil-works/pi-ai@$version" "@deepseek-ai/dsh-timeout@$baseline" "@deepseek-ai/dsh-llm@$baseline" "@deepseek-ai/dsh-llm-pi-ai@$baseline"
          echo "DSH_REASONING_RUNTIME=$RUNNER_TEMP/reasoning-1304/node_modules/@earendil-works/pi-ai" >> "$GITHUB_ENV"
      - name: 空摘要、隔离、负控与两轮工具回传
        run: |
          node --test scripts/patches/tests/reasoning-envelope-1304.test.mjs
          node --test scripts/patches/tests/reasoning-envelope-1304.integration.mjs

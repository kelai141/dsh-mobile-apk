# build-apk.yml — 云端构建 dsh-mobile APK（自包含：快照随本仓库提交，无需协调库）
#
# 设计：APK 在 dsh-mobile-apk 用 gradle 打包，故 workflow 放本仓库（GITHUB_REPOSITORY = dsh-mobile-apk）。
# 运行时快照（双 ABI，注入后最终态）已提交到本仓库 snapshots/<abi>/snapshot.tar.xz（Git LFS），
# 云端只做 gradle 打包，不重建快照、不依赖协调库。仅 upload-artifact 供本地下载 debug，不出 Release。

name: build-apk

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: 'APK 版本后缀（默认 ci）'
        type: string
        default: '-ci'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64, x86_64]
      fail-fast: false
    steps:
      - name: 检出本仓库（含 Git LFS 快照）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 准备 Java（gradle 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: stage 快照（snapshots/<abi> -> app/src/main/assets/）
        shell: bash
        run: |
          set -e
          abi="${{ matrix.abi }}"
          [ -f "snapshots/${abi}/snapshot.tar.xz" ] || { echo "缺 snapshots/${abi}/snapshot.tar.xz"; exit 1; }
          cp "snapshots/${abi}/snapshot.tar.xz" app/src/main/assets/snapshot.tar.xz
          if [ -f "snapshots/${abi}/snapshot.sha256" ]; then cp "snapshots/${abi}/snapshot.sha256" app/src/main/assets/snapshot.sha256; else
            echo "缺 snapshots/${abi}/snapshot.sha256"; exit 1
          fi
          ls -lh app/src/main/assets/snapshot.tar.xz && cat app/src/main/assets/snapshot.sha256; echo

      - name: gradle assembleDebug (${abi})
        shell: bash
        run: |
          set -e
          abi="${{ matrix.abi }}"
          # 增量打包防护：清老 assets/输出，防跨 ABI 叠加
          rm -rf app/build/intermediates/assets app/build/outputs/apk/debug
          ./gradlew :app:assembleDebug --no-daemon -PversionNameSuffix="${{ github.event.inputs.suffix || '-ci' }}"

      - name: 拷贝产物 (${abi})
        shell: bash
        run: |
          set -e
          abi="${{ matrix.abi }}"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/dsh-mobile-apk-v0.13.0${{ github.event.inputs.suffix || '-ci' }}-${abi}.apk"
          ls -lh out/

      - name: 上传 APK 产物（本地下载 debug；不出 Release）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk-${{ github.event.inputs.suffix || 'ci' }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

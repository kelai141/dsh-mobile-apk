- id: bash-sandbox
  disabled: true
- insert:
    - id: shell-termux
      name: '@dsh-android/dsh-shell-termux'
      config:
        bashPath: /x/bash
    - id: host-web-compat
      name: '@dsh-android/dsh-host-web-compat'
    - id: ui-responsive
      name: '@dsh-android/dsh-client-ui-responsive'
    - id: android-bridge
      name: '@dsh-android/dsh-android-bridge'
    - id: android-manage
      name: '@dsh-android/dsh-android-manage'
    - id: android-linux-env
      name: '@dsh-android/dsh-android-linux-env'
    - id: android-file-open
      name: '@dsh-android/dsh-android-file-open'
    - id: android-browser
      name: '@dsh-android/dsh-android-browser'
    - id: android-vdisplay
      name: '@dsh-android/dsh-android-vdisplay'
    - id: dsh-code-diff-viewer
      name: dsh-code-diff-viewer
      config:
        theme: dark
    - id: dsh-find-plugin
      name: dsh-find-plugin
- insert:
    - id: dsh-undo-savepoint
      name: dsh-undo-savepoint
- insert:
    - id: dshmarketplace
      name: dshmarketplace-plugin
- id: client-hmr
  disabled: true
- id: ptc-runtime
  config:
    nodeExecutable: /x/node
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers: {}
